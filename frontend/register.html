<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <title>Registro — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/auth.css" />
</head>
<body>
  <main class="page-auth">
    <div class="auth-brand">
      <div class="auth-brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.5-7-11a7 7 0 1 1 14 0c0 6.5-7 11-7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
      </div>
      <span class="auth-brand-name">ChambaPoint</span>
    </div>

    <h1 class="auth-heading">Crea tu cuenta</h1>
    <p class="auth-sub">Únete como cliente o trabajador en segundos.</p>

    <form class="auth-form" id="registerForm" novalidate>
      <div class="field">
        <label for="name">Nombre completo</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" required minlength="2" />
        <span class="field-error" data-for="name"></span>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required />
        <span class="field-error" data-for="email"></span>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6" />
          <button type="button" class="pw-toggle" id="togglePw" aria-label="Mostrar contraseña">Ver</button>
        </div>
        <span class="field-error" data-for="password"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" required minlength="6" />
        <span class="field-error" data-for="confirmPassword"></span>
      </div>

      <div class="field">
        <label for="role">¿Cómo quieres usar ChambaPoint?</label>
        <select id="role" name="role" required>
          <option value="Customer">Customer — Buscar servicios</option>
          <option value="Worker">Worker — Ofrecer mis servicios</option>
        </select>
        <span class="field-error" data-for="role"></span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Crear cuenta</button>
    </form>

    <div class="auth-footer auth-link-row">
      <span>¿Ya tienes cuenta?</span>
      <a href="login.html">Inicia sesión</a>
    </div>
  </main>
  <script type="module" src="js/screens/register.js"></script>
</body>
</html>
