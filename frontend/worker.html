<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <title>Perfil técnico — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/explore.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button type="button" class="btn btn-ghost btn-icon" id="backBtn" aria-label="Volver">←</button>
      <strong id="headerName" style="font-size: 15px">Perfil</strong>
      <span class="spacer"></span>
      <span class="badge badge-success">♥</span>
    </header>

    <div id="profileRoot">
      <div class="page">
        <div class="skeleton-card"><div class="skeleton-avatar skeleton"></div><div class="skeleton-lines"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-avatar skeleton"></div><div class="skeleton-lines"><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script type="module" src="js/screens/worker.js"></script>
</body>
</html>
