<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Explorar — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/explore.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="explore.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-4.5-7-11a7 7 0 1 1 14 0c0 6.5-7 11-7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        ChambaPoint
      </a>
      <span class="spacer"></span>
      <span id="userAvatar" class="avatar" title="Mi cuenta"></span>
    </header>

    <main class="page" id="explorePage">
      <div class="explore-search">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Buscar electricista, gasfitero..."
          aria-label="Buscar técnicos"
        />
        <button type="button" class="search-btn" id="searchBtn" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
        </button>
      </div>

      <div class="category-chips" id="categoryChips" role="tablist" aria-label="Categorías">
        <button type="button" class="chip active" data-profession="" role="tab" aria-selected="true">Todas</button>
        <button type="button" class="chip" data-profession="Plomería" role="tab" aria-selected="false">Plomería</button>
        <button type="button" class="chip" data-profession="Electricidad" role="tab" aria-selected="false">Electricidad</button>
        <button type="button" class="chip" data-profession="Carpintería" role="tab" aria-selected="false">Carpintería</button>
        <button type="button" class="chip" data-profession="Pintura" role="tab" aria-selected="false">Pintura</button>
      </div>

      <div class="map-toolbar">
        <span class="map-title">Técnicos en el mapa</span>
        <button type="button" class="map-locate" id="locateBtn" aria-label="Mi ubicación">Mi ubicación</button>
      </div>
      <div class="map-panel" id="map" role="application" aria-label="Mapa de Lima con técnicos cercanos"></div>

      <div class="section-head">
        <h2>Recomendados Cerca</h2>
        <a href="#map" id="verMapa">Ver Mapa</a>
      </div>

      <div id="workersList" aria-live="polite"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/screens/explore.js"></script>
</body>
</html>
