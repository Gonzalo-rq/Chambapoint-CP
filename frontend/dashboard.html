<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Dashboard — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-4.5-7-11a7 7 0 1 1 14 0c0 6.5-7 11-7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        ChambaPoint
      </a>
      <span class="spacer"></span>
      <a class="btn btn-ghost btn-sm" href="edit-profile.html">Editar perfil</a>
      <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">Salir</button>
      <span id="userAvatar" class="avatar" title="Sesión activa"></span>
    </header>

    <main class="page page-narrow" id="dashboardPage">
      <section class="dash-hero">
        <div class="dash-hero-text">
          <p class="dash-hello" id="helloName">Hola</p>
          <h1 id="dashTitle">Resumen de chambas</h1>
        </div>
        <div id="heroAvatar" class="avatar avatar-lg"></div>
      </section>

      <section class="earnings-card" aria-label="Ingresos de la semana">
        <div class="earnings-top">
          <span class="earnings-label">Ingresos semana</span>
          <span class="earnings-period text-muted" id="earnPeriod"></span>
        </div>
        <p class="earnings-total" id="earnTotal">S/ 0.00</p>
        <div class="week-chart" id="weekChart" role="img" aria-label="Gráfico Lun a Dom"></div>
      </section>

      <section class="counters" id="counters" aria-label="Contadores"></section>

      <section class="dash-col">
        <div class="section-title">Citas pendientes</div>
        <div id="pendingAppts"></div>
      </section>

      <section class="dash-col">
        <div class="section-title">Actividad reciente</div>
        <div id="recentActivity"></div>
      </section>
    </main>
  </div>

  <div id="modalRoot"></div>

  <script type="module" src="js/screens/dashboard.js"></script>
</body>
</html>
