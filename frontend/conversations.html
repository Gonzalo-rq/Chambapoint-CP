<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Mensajes — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/chat.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="explore.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-4.5-7-11a7 7 0 1 1 14 0c0 6.5-7 11-7 11z" />
            <circle cx="12" cy="10" r="2.5" />
          </svg>
        </span>
        ChambaPoint
      </a>
      <span class="spacer"></span>
      <span id="userAvatar" class="avatar" title="Sesión"></span>
    </header>

    <main class="page page-narrow">
      <div class="page-intro">
        <h1>Mensajes</h1>
        <p class="text-muted">Conversaciones con clientes y técnicos.</p>
      </div>

      <div class="conv-search">
        <input id="convSearch" type="search" placeholder="Buscar conversación..." aria-label="Buscar conversación" />
      </div>

      <div id="convList" class="conv-list" aria-live="polite"></div>
      <div id="convEmpty" class="empty-state" hidden>
        <h3>Sin conversaciones</h3>
        <p>Acuerda un servicio desde Solicitudes o el perfil del técnico.</p>
        <p style="margin-top:12px"><a class="btn btn-primary" href="explore.html">Explorar</a></p>
      </div>
    </main>
  </div>

  <script type="module" src="js/screens/conversations.js"></script>
</body>
</html>
