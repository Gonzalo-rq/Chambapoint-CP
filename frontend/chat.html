<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B7A3D" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <title>Chat — ChambaPoint</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/chat.css" />
</head>
<body class="chat-body">
  <div class="app-shell chat-shell">
    <header class="app-header chat-header">
      <a class="back-link" href="conversations.html" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span id="peerAvatar" class="avatar avatar-sm"></span>
      <div class="peer-meta">
        <strong id="peerName">Cargando...</strong>
        <span id="peerSub" class="text-muted">Chat</span>
      </div>
      <span class="live-dot" title="Conectado" aria-hidden="true"></span>
    </header>

    <div id="messages" class="chat-messages" aria-live="polite"></div>

    <form id="chatForm" class="chat-composer" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Escribe un mensaje..." aria-label="Mensaje" maxlength="2000" />
      <button id="sendBtn" type="submit" class="btn btn-primary btn-icon" aria-label="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>

  <script type="module" src="js/screens/chat.js"></script>
</body>
</html>
